<title>CSI Signal Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Saira+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: one illustrated system diagram (hardware at a glance); clicking a part opens its detail panel underneath. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --sunk:#E7EBEF; --ink:#18212B; --muted:#5A6878; --line:#C6CFD8;
  --accent:#2952B8; --accent-soft:#E2E9F8;
  --radio:#B0640C; --mqtt:#0B7680; --row:#2D7A4B; --plot:#B4385A;
  --pcb:#232C38; --metal:#C3C9D1; --pin:#C9A24B;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0F151C; --surface:#16202A; --sunk:#1C2733; --ink:#E3E9EF; --muted:#94A3B3; --line:#2E3C4A;
  --accent:#7EA2F2; --accent-soft:#1E2C47;
  --radio:#E49A44; --mqtt:#4CC0C9; --row:#63C08A; --plot:#EE7C9A;
  --pcb:#2B3644; --metal:#7E8896; --pin:#B8954A;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F151C; --surface:#16202A; --sunk:#1C2733; --ink:#E3E9EF; --muted:#94A3B3; --line:#2E3C4A;
  --accent:#7EA2F2; --accent-soft:#1E2C47;
  --radio:#E49A44; --mqtt:#4CC0C9; --row:#63C08A; --plot:#EE7C9A;
  --pcb:#2B3644; --metal:#7E8896; --pin:#B8954A;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);padding-inline:16px;padding-block:16px}
.app{display:flex;flex-direction:column;gap:14px;max-width:1240px;margin:0 auto}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 20px;flex-wrap:wrap}
h1{font:700 30px/1 var(--display);margin:0;letter-spacing:.01em}
h2{font:600 24px/1.15 var(--display);margin:0;text-wrap:balance}
p{margin:0}
code{font-family:var(--mono);font-size:.86em}
.status{display:flex;gap:8px;flex-wrap:wrap;font:12px var(--mono);color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums}
.chip b{color:var(--row);font-weight:500}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
svg.sys{display:block;width:100%;min-width:780px;height:auto}
.hint{color:var(--muted);font-size:14px}

/* diagram */
.zone rect{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 5}
.zl{font:700 14px var(--display);letter-spacing:.12em;fill:var(--muted)}
.zs{font:400 11.5px var(--mono);fill:var(--muted)}
.nm{font:700 22px var(--display);fill:var(--ink)}
.nm.sm{font-size:18px}
.ns{font:400 12px var(--mono);fill:var(--muted)}
.pcb{fill:var(--pcb)} .metal{fill:var(--metal)}
.ant{fill:none;stroke:var(--pin);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stick{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.motion{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.card{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.bar{fill:var(--sunk);stroke:var(--ink);stroke-width:2}
.term{font:500 12px var(--mono);fill:var(--ink)}
.flow{fill:none;stroke-width:2.4;stroke-dasharray:8 6;animation:dash 1.1s linear infinite}
.flow.radio{stroke:var(--radio)} .flow.mqtt{stroke:var(--mqtt)} .flow.row{stroke:var(--row)} .flow.plot{stroke:var(--plot)}
@keyframes dash{to{stroke-dashoffset:-14}}
.tag rect{fill:var(--surface);stroke:var(--c);stroke-width:1.2}
.tag text{font:500 11px var(--mono);fill:var(--ink)}
.tag .t2{fill:var(--c)}
.dim{stroke:var(--muted);stroke-width:1.2}
.n{cursor:pointer;outline:none}
.n .hit{fill:transparent}
.n .ico{transition:filter .2s}
.n .nm{transition:fill .2s}
.n:hover .ico,.n:focus-visible .ico{filter:drop-shadow(0 0 3px var(--accent))}
.n:hover .nm,.n:focus-visible .nm{fill:var(--accent)}
.n.on .ico{filter:drop-shadow(0 0 2px var(--accent)) drop-shadow(0 0 7px var(--accent))}
.n.on .nm{fill:var(--accent)}

/* detail panel */
.detail{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.detail.enter{animation:rise .28s ease-out}
@keyframes rise{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:none}}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.kicker{font:500 11.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px 28px}
@media (max-width:820px){.dgrid{grid-template-columns:1fr}}
.dgrid>div{display:flex;flex-direction:column;gap:12px;min-width:0}
.sum{max-width:62ch}
.lab{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chain{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.chain li{display:flex;align-items:center;gap:6px}
.chain .st{border:1.5px solid var(--c,var(--line));border-radius:9px;padding:6px 10px;background:color-mix(in srgb,var(--c,var(--line)) 9%,var(--surface));display:flex;flex-direction:column;min-width:0}
.chain .st b{font:600 14px var(--sans)}
.chain .st span{font:400 11.5px var(--mono);color:var(--muted)}
.chain .ar{color:var(--muted);font-size:16px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:5px 14px;margin:0;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--mono);font-size:12.5px;word-break:break-word;font-variant-numeric:tabular-nums}
details{border:1px solid var(--line);border-radius:9px;padding:7px 11px}
summary{cursor:pointer;font-weight:600;font-size:14px}
details>*:not(summary){margin-top:8px}
details p{font-size:14px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font:500 11px var(--mono);color:var(--muted)}
td.f{font-family:var(--mono);white-space:nowrap}
pre.msg{margin:0;background:var(--sunk);border-radius:8px;padding:10px 12px;font:12px/1.5 var(--mono);overflow-x:auto;white-space:pre}
.spark{display:block;width:100%;height:64px}
.spark rect{fill:var(--plot)} .spark .z{fill:var(--line)}
.spark text{font:10px var(--mono);fill:var(--muted)}
.cap{font-size:13px;color:var(--muted)}
button{font:600 14px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.flow{animation:none}.detail.enter{animation:none}*{transition:none!important}}
</style>

<div class="app">
  <div class="top">
    <h1>CSI Signal Path</h1>
    <div class="status" aria-label="Last measured">
      <span class="chip">2 × ESP32-C6</span>
      <span class="chip"><b>100.1</b> frames/s at the RX</span>
      <span class="chip">ESP-NOW · home WiFi</span>
    </div>
  </div>

  <div class="stage">
    <svg class="sys" id="sys" viewBox="0 0 1200 500" role="group" aria-label="System diagram. Each part is a button that shows its details."></svg>
  </div>
  <p class="hint">Click any part of the diagram to see what's inside it.</p>

  <section class="detail" id="detail" aria-live="polite">
    <div class="dhead">
      <div><span class="kicker" id="dkicker"></span><h2 id="dtitle"></h2></div>
      <button type="button" id="overview" hidden>Back to overview</button>
    </div>
    <div class="dgrid">
      <div><p class="sum" id="dsum"></p><dl class="kv" id="dfacts"></dl></div>
      <div><div class="lab" id="dflowlab">Inside</div><ol class="chain" id="dflow"></ol><div id="dextra"></div><div id="dmore"></div></div>
    </div>
  </section>
</div>

<script>
/* ---------- real data: one TX record from hub/data/rx-1.csv (Oct 8) ---------- */
const ROW='1791509117.483122,rx-1,24292,AP,20:6E:F1:0A:E4:E8,-61,11,2,0,0,0,0,0,0,0,0,-95,0,6,0,176558104,0,84,0,0,176.641,128,[0 0 0 0 0 0 0 0 31 -3 32 -2 32 -1 35 -1 35 2 39 3 37 3 40 2 39 2 38 1 38 3 39 3 39 4 39 3 40 2 39 0 40 -3 40 -4 40 -6 40 -7 43 -11 41 -14 42 -17 43 -17 44 -19 46 -17 47 -20 45 -21 0 0 44 -25 46 -23 48 -23 43 -23 42 -25 40 -30 38 -28 35 -31 36 -31 34 -34 35 -31 32 -32 32 -32 29 -35 28 -34 29 -37 27 -37 27 -38 25 -40 25 -37 25 -39 28 -36 29 -34 31 -31 32 -28 31 -28 32 -23 33 -21 0 0 0 0 0 0 ]';
const COLS=['arrival_epoch','node_id','seq','role','mac','rssi','rate','sig_mode','mcs','bandwidth','smoothing','not_sounding','aggregation','stbc','fec_coding','sgi','noise_floor','ampdu_cnt','channel','secondary_channel','local_timestamp','ant','sig_len','rx_state','real_time_set','real_timestamp','len','csi'];
const F=ROW.split(','), R=Object.fromEntries(COLS.map((c,i)=>[c,F[i]]));
const IQ=R.csi.replace(/[\[\]]/g,'').trim().split(/\s+/).map(Number);
const AMP=[]; for(let i=0;i+1<IQ.length;i+=2) AMP.push(Math.hypot(IQ[i],IQ[i+1]));
const LIVE=AMP.filter(a=>a>0).length;
const short=(s,n)=>s.length>n?s.slice(0,n)+' …':s;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function spark(){
  const w=320,h=64,bw=w/AMP.length,mx=Math.max(...AMP);
  const bars=AMP.map((a,i)=>a>0?`<rect x="${(i*bw+.5).toFixed(1)}" y="${(h-14-(a/mx)*(h-18)).toFixed(1)}" width="${(bw-1).toFixed(1)}" height="${((a/mx)*(h-18)).toFixed(1)}"/>`
    :`<rect class="z" x="${(i*bw+.5).toFixed(1)}" y="${h-16}" width="${(bw-1).toFixed(1)}" height="2"/>`).join('');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Amplitude of the 64 subcarrier slots in one real record">${bars}<text x="0" y="${h-2}">slot 0</text><text x="${w/2}" y="${h-2}" text-anchor="middle">32 (DC)</text><text x="${w}" y="${h-2}" text-anchor="end">63</text></svg>`;
}
const table=(head,rows)=>`<div class="tbl-wrap"><table><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i===0?' class="f"':''}>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;

/* ---------- diagram ---------- */
function board(x,y){
  return `<rect class="pcb" x="${x-30}" y="${y-70}" width="60" height="140" rx="7"/>
    <rect class="metal" x="${x-20}" y="${y-60}" width="40" height="46" rx="3"/>
    <path class="ant" d="M${x-14},${y-52} h7 v5 h7 v-5 h7 v5 h7"/>
    <rect class="metal" x="${x-9}" y="${y+56}" width="18" height="8" rx="3"/>`;
}
function tag(x,y,l1,l2,c){
  const w=Math.max(l1.length,l2?l2.length:0)*7+18, h=l2?36:22;
  return `<g class="tag" style="--c:var(${c})"><rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="6"/>
    <text x="${x}" y="${l2?y-3:y+4}" text-anchor="middle">${l1}</text>${l2?`<text class="t2" x="${x}" y="${y+12}" text-anchor="middle">${l2}</text>`:''}</g>`;
}
const node=(id,label,hit,ico,text)=>`<g class="n" data-id="${id}" tabindex="0" role="button" aria-label="${label}">
  <g class="ico">${ico}</g>${text}
  <rect class="hit" x="${hit[0]}" y="${hit[1]}" width="${hit[2]}" height="${hit[3]}"/></g>`;
const m=c=>`<marker id="a-${c}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--${c})"/></marker>`;

document.getElementById('sys').innerHTML=`
<defs>${['radio','mqtt','row','plot'].map(m).join('')}</defs>
<g class="zone"><rect x="676" y="34" width="508" height="450" rx="20"/>
  <text class="zl" x="700" y="64">LAPTOP</text><text class="zs" x="700" y="82">on your home WiFi</text></g>

<path class="flow radio" d="M162,282 L282,282" marker-end="url(#a-radio)"/>
<path class="flow radio" d="M378,282 L494,282" marker-end="url(#a-radio)"/>
<path class="flow mqtt" d="M602,262 C660,262 690,206 742,206" marker-end="url(#a-mqtt)"/>
<path class="flow mqtt" d="M842,206 L992,206" marker-end="url(#a-mqtt)"/>
<path class="flow row" d="M1040,250 C1040,300 970,300 966,344" marker-end="url(#a-row)"/>
<path class="flow plot" d="M1080,250 C1080,300 1102,300 1104,344" marker-end="url(#a-plot)"/>

${tag(330,152,'ESP-NOW broadcast','100/s · 802.11n HT20','--radio')}
${tag(640,318,'MQTT via home WiFi','csi/rx-1/data','--mqtt')}
${tag(917,182,'csi/+/data','','--mqtt')}
<line class="dim" x1="110" y1="452" x2="550" y2="452"/><line class="dim" x1="110" y1="444" x2="110" y2="460"/><line class="dim" x1="550" y1="444" x2="550" y2="460"/>
${tag(330,452,'a few metres apart','','--muted')}

${node('tx','TX board',[60,196,100,226],board(110,282),
  `<text class="nm" x="110" y="396" text-anchor="middle">TX</text><text class="ns" x="110" y="414" text-anchor="middle">sends frames</text>`)}

${node('air','Person and the sensing link',[280,196,100,226],
  `<circle class="stick" cx="330" cy="226" r="13"/>
   <path class="stick" d="M330,239 L330,295 M330,252 L310,280 M330,252 L350,280 M330,295 L314,340 M330,295 L346,340"/>`,
  `<text class="nm" x="330" y="396" text-anchor="middle">Person</text><text class="ns" x="330" y="414" text-anchor="middle">changes the signal</text>`)}

${node('rx','RX board',[500,196,100,226],board(550,282),
  `<text class="nm" x="550" y="396" text-anchor="middle">RX</text><text class="ns" x="550" y="414" text-anchor="middle">measures CSI</text>`)}

${node('broker','MQTT broker',[740,108,100,144],
  `<circle class="card" cx="790" cy="206" r="40" style="stroke:var(--mqtt)"/>
   <path d="M790,206 L770,186 M790,206 L810,186 M790,206 L770,226 M790,206 L810,226" style="stroke:var(--mqtt);stroke-width:2"/>
   <circle cx="790" cy="206" r="7" style="fill:var(--mqtt)"/>
   ${[[770,186],[810,186],[770,226],[810,226]].map(([a,b])=>`<circle cx="${a}" cy="${b}" r="4.5" style="fill:var(--surface);stroke:var(--mqtt);stroke-width:2"/>`).join('')}`,
  `<text class="nm sm" x="790" y="128" text-anchor="middle">Broker</text><text class="ns" x="790" y="146" text-anchor="middle">mosquitto</text>`)}

${node('hub','Hub',[996,108,128,144],
  `<rect class="card" x="1000" y="164" width="120" height="82" rx="8"/>
   <path class="bar" d="M1000,180 v-8 a8,8 0 0 1 8,-8 h104 a8,8 0 0 1 8,8 v8 z"/>
   <circle cx="1011" cy="172" r="2.6" style="fill:var(--plot)"/><circle cx="1020" cy="172" r="2.6" style="fill:var(--radio)"/><circle cx="1029" cy="172" r="2.6" style="fill:var(--row)"/>
   <text class="term" x="1010" y="202">&gt; stamp</text><text class="term" x="1010" y="218">&gt; save</text><text class="term" x="1010" y="234">&gt; plot</text>`,
  `<text class="nm sm" x="1060" y="128" text-anchor="middle">Hub</text><text class="ns" x="1060" y="146" text-anchor="middle">csi_hub.py</text>`)}

${node('csv','CSV file',[920,346,92,126],
  `<path class="card" d="M942,352 h32 l14,14 v56 h-46 z" style="stroke:var(--row)"/><path d="M974,352 v14 h14" style="fill:none;stroke:var(--row);stroke-width:2"/>
   ${[0,1,2,3,4].map(i=>`<line x1="950" y1="${376+i*9}" x2="${i%2?972:980}" y2="${376+i*9}" style="stroke:var(--row);stroke-width:2"/>`).join('')}`,
  `<text class="nm sm" x="966" y="448" text-anchor="middle">rx-1.csv</text><text class="ns" x="966" y="464" text-anchor="middle">saved rows</text>`)}

${node('plot','Live plot',[1054,346,104,126],
  `<rect class="card" x="1064" y="352" width="82" height="66" rx="6" style="stroke:var(--plot)"/>
   ${[...Array(9)].map((_,i)=>`<rect x="${1070+i*8}" y="358" width="7" height="30" style="fill:var(--plot);opacity:${[.25,.3,.25,.85,.95,.7,.3,.25,.3][i]}"/>`).join('')}
   <polyline points="1070,410 1088,410 1094,396 1100,404 1106,394 1112,410 1140,410" style="fill:none;stroke:var(--plot);stroke-width:2"/>`,
  `<text class="nm sm" x="1105" y="448" text-anchor="middle">Live plot</text><text class="ns" x="1105" y="464" text-anchor="middle">motion score</text>`)}
`;

/* ---------- details ---------- */
const kvRows=r=>r.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('');
const D={
  overview:{kicker:'Overview',title:'How the system works',
    sum:'The TX board broadcasts a steady stream of WiFi frames across the room. Every RX board measures how the room changed each frame (its CSI) and sends one record per frame to the laptop through your home WiFi. On the laptop, the broker hands every record to the hub, which time-stamps it, saves it, and plots motion.',
    facts:[['boards','2 × ESP32-C6, identical hardware'],['at the RX','100.1 frames/s, 10 ms apart'],['network','all boards + laptop on home WiFi'],['new receiver','flash + set WiFi, NODEID, MQTTHOST']],
    flowlab:'End to end',
    flow:[['TX','sends frames','--radio'],['Person','changes them','--radio'],['RX','measures CSI','--radio'],['Broker','routes','--mqtt'],['Hub','stamps, saves','--row'],['Plot','shows motion','--plot']]},
  tx:{kicker:'TX board · ESP32-C6 · firmware/tx',title:'Transmitter',
    sum:'Joins your home WiFi (which sets its channel) and broadcasts a tiny ESP-NOW frame 100 times a second, straight over the air to every RX. What the frame says doesn\'t matter; it only has to cross the room so the receivers can measure it.',
    facts:[['MAC','1a:00:00:00:00:01 (fixed)'],['sends','ESP-NOW broadcast, 4-byte counter'],['format','802.11n HT20, MCS0'],['rate','100/s (RATE), measured 100.1'],['power','any USB port or charger']],
    flow:[['Settings','RATE = 100','--line'],['Send loop','every 10 ms, fixed','--radio'],['Radio','ESP-NOW · HT20','--radio']],
    more:[['Settings (typed over serial, saved on the board)',table(['key','value'],[['STASSID','your home WiFi'],['STAPASS','(stored, never printed)'],['RATE','100 · applies without reboot']])],
          ['Why a fixed address','<p>Every TX sends from <code>1a:00:00:00:00:0N</code>. Receivers keep only frames from senders starting with <code>1a:00:00:00:00</code>, so a new RX needs no TX-specific setup.</p>'],
          ['Why 802.11n and not ESP-NOW\'s default','<p>ESP-NOW normally sends at 1 Mbps 802.11b, which has no subcarriers to measure. The TX forces 802.11n HT20 at MCS0 so every frame yields 64-slot CSI.</p>']]},
  air:{kicker:'The sensing link',title:'What the RX actually sees',
    sum:'Each frame reaches the RX along many paths at once: straight across, and bounced off walls, furniture and people. The RX measures the result separately on 64 narrow frequency slots (subcarriers). When someone moves, the paths change and so does this pattern. That change is the signal.',
    facts:[['band','2.4 GHz, your home WiFi\'s channel'],['width','20 MHz, 802.11n'],['subcarriers',`64 slots, ${LIVE} carry signal`],['placement','boards a few metres apart; walk across the line']],
    flowlab:'One real frame',
    extra:()=>`${spark()}<p class="cap">Amplitude per subcarrier from record #${R.seq} of your Oct 8 capture (RSSI ${R.rssi} dBm). Gaps are guard bands and the centre (DC) slot, which never carry signal.</p>`},
  rx:{kicker:'RX board · ESP32-C6 · firmware/rx',title:'Receiver',
    sum:'Joins your home WiFi and listens to the whole channel. It keeps only frames from the TX; for each one the radio produces a channel estimate, which the firmware numbers, writes out as one line of text, and publishes to the laptop.',
    facts:[['node id','rx-1 (NODEID)'],['network','home WiFi (STASSID)'],['keeps','frames from 1a:00:00:00:00:*'],['publishes','csi/rx-1/data → MQTTHOST:1883'],['also prints','CSI_DATA lines on USB serial']],
    flow:[['Radio','listens to channel','--radio'],['Filter','TX frames only','--radio'],['Callback','number + format','--line'],['Buffer','32 KB, never waits','--line'],['Publisher','MQTT, QoS 0','--mqtt']],
    more:[['Settings (typed over serial, saved on the board)',table(['key','value','group'],[['STASSID','your home WiFi','WiFi'],['STAPASS','(stored, never printed)','WiFi'],['NODEID','rx-1','reporting'],['MQTTHOST','laptop IP','reporting'],['MQTTPORT','1883','reporting'],['MQTTTOPIC','csi','reporting']])+'<p>With one radio, the RX can only listen on the channel its WiFi uses, so the sensing channel is your home WiFi\'s channel.</p>'],
          ['Why there\'s a buffer','<p>The callback runs inside the WiFi driver and must never wait, or the radio stalls. It drops each record into a 32 KB buffer (about half a second) and a separate task sends them. If the laptop stops listening, records are dropped rather than piling up. Before this, the hub only got 1 record/s.</p>'],
          ['Why a 2nd receiver needs no extra work','<p>The TX broadcasts, so every RX on the channel hears the same frames. A new RX only needs WiFi details, its own NODEID and MQTTHOST.</p>']]},
  broker:{kicker:'Laptop · mosquitto',title:'MQTT broker',
    sum:'A post office for messages. Each receiver publishes to its own topic; the hub subscribes to all of them. Receivers and the hub never talk directly, so adding a receiver doesn\'t change the hub.',
    facts:[['run','mosquitto -c mosquitto.conf.example'],['port','1883, no login'],['in','csi/rx-1/data (one topic per receiver)'],['out','csi/+/data (+ = any receiver)']],
    flow:[['csi/rx-1/data','from RX','--mqtt'],['match topic','',''],['csi/+/data','to hub','--mqtt']],

  hub:{kicker:'Laptop · hub/csi_hub.py',title:'Hub',
    sum:'Receives every record from every receiver. It stamps each one with the laptop\'s clock, appends it to that receiver\'s CSV file, and feeds the live plot. A status line every second shows how fast each receiver is arriving.',
    facts:[['run','.venv/bin/python csi_hub.py --live'],['status line','rx-1: 86/s total=… ok'],['clocks','boards never synced; laptop time is the shared timeline']],
    flow:[['Receive','csi/+/data','--mqtt'],['Stamp','arrival_epoch','--line'],['Save','data/<node>.csv','--row'],['Plot','TX frames only','--plot']],
    more:[['Why the laptop\'s clock','<p>Each board keeps its own time and they drift apart. <code>arrival_epoch</code> lines up records from all boards; <code>seq</code> orders records within one board and reveals any that were dropped.</p>']]},
  csv:{kicker:'Laptop · hub/data/',title:'Saved data',
    sum:'One file per receiver. Every file has the same 28 columns, so a new receiver produces data in exactly the same format.',
    facts:[['rows','8,414'],['size','4.3 MB'],['one row per','captured frame']],
    flowlab:'A real row',
    extra:()=>`<pre class="msg">${esc(short(ROW,150))}</pre>`,
    more:[['All columns, this row',table(['column','value'],COLS.slice(0,27).map(c=>[c,R[c]]).concat([['csi','[128 values: 64 × (I, Q)]']]))]]},
  plot:{kicker:'Laptop · csi_hub.py --live',title:'Live plot',
    sum:'The top panel is a heatmap of every subcarrier over the last 20 seconds. The bottom panel is a motion score: flat when the room is still, rising when someone moves through the link.',
    facts:[['window','50 frames ≈ 0.6 s'],['shows','TX frames only'],['code','motion_score() in csi_hub.py'],['test','hub/test_csi_hub.py']],
    flowlab:'How the score is made',
    flow:[['I/Q pairs','128 numbers','--radio'],['Amplitude','√(I² + Q²)','--plot'],['÷ mean','cancels gain','--plot'],['Rolling spread','over 50 frames','--plot'],['Score','one number','--plot']],
    more:[['Why divide by the mean','<p>The radio adjusts its own gain from moment to moment, which scales every subcarrier up or down together. Dividing each frame by its average cancels that, so only changes between subcarriers (what a moving body causes) count as motion.</p>']]}
};

const svg=document.getElementById('sys'), panel=document.getElementById('detail');
let current='overview';
function show(id){
  current=id; const d=D[id];
  svg.querySelectorAll('.n').forEach(g=>g.classList.toggle('on',g.dataset.id===id));
  document.getElementById('dkicker').textContent=d.kicker;
  document.getElementById('dtitle').textContent=d.title;
  document.getElementById('dsum').textContent=d.sum;
  document.getElementById('dfacts').innerHTML=kvRows(d.facts);
  document.getElementById('dflowlab').textContent=d.flowlab||'Inside';
  document.getElementById('dflow').innerHTML=(d.flow||[]).map(([a,b,c],i)=>
    `${i?'<li class="ar" aria-hidden="true">→</li>':''}<li><div class="st"${c?` style="--c:var(${c})"`:''}><b>${esc(a)}</b>${b?`<span>${esc(b)}</span>`:''}</div></li>`).join('');
  document.getElementById('dflow').hidden=!d.flow;
  document.getElementById('dextra').innerHTML=d.extra?d.extra():'';
  document.getElementById('dmore').innerHTML=(d.more||[]).map(([s,h])=>`<details><summary>${esc(s)}</summary>${h}</details>`).join('');
  document.getElementById('overview').hidden=id==='overview';
  panel.classList.remove('enter'); void panel.offsetWidth; panel.classList.add('enter');
}
svg.querySelectorAll('.n').forEach(g=>{
  const go=()=>{show(current===g.dataset.id?'overview':g.dataset.id);
    const r=panel.getBoundingClientRect(); if(r.top>innerHeight-80) panel.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});};
  g.addEventListener('click',go);
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
});
document.getElementById('overview').onclick=()=>show('overview');
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&current!=='overview')show('overview');});
show('overview');
</script>

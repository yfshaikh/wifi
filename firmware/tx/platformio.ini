[platformio]
src_dir = main

; ESP32-C6 needs ESP-IDF >= 5.1. Official platformio/espressif32 stalled before
; C6 support, so this uses the community pioarduino fork (pinned: IDF 5.5.5).
[env:tx]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = espidf
board = esp32-c6-devkitc-1
; ponytail: 4MB so one image boots on both 4MB and 8MB C6 boards.
board_upload.flash_size = 4MB
board_build.partitions = partitions_singleapp_large.csv
monitor_speed = 921600
